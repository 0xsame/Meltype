# コンフリクトのお知らせ (.github/bot/conflicts.mjs)。
#   main に push されたとき: 開いている Pull Request を全部調べ、新しくコンフリクトしたものにラベルとコメントを付ける
#   Pull Request が更新されたとき: その Pull Request を調べ、解消していればラベルを外す
# pull_request_target だが、Pull Request のコードは checkout しない (GitHub の API で状態を読むだけ)。
name: conflicts

on:
  push:
    branches: [main]
  pull_request_target:
    types: [synchronize, reopened]
  workflow_dispatch:

permissions: {}

concurrency:
  group: conflicts-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      # bot のスクリプトだけを main から取る (Pull Request のコードは取らない)
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: main
          sparse-checkout: .github/bot
          persist-credentials: false
      - id: app
        if: vars.BOT_APP_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
      - name: main の変更でコンフリクトした Pull Request を知らせる
        if: github.event_name != 'pull_request_target'
        run: node .github/bot/conflicts.mjs main
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token || github.token }}
      - name: この Pull Request のコンフリクトを確かめる
        if: github.event_name == 'pull_request_target'
        run: node .github/bot/conflicts.mjs pr "$NUMBER"
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token || github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
